      <stop offset="0%" stop-color="#071018" />
      <stop offset="55%" stop-color="#0b1e2a" />
      <stop offset="100%" stop-color="#11344a" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f2a" stop-opacity="0.92" />
